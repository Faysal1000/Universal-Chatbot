[project]
name = "local-llm"
version = "1.0.0"
description = "Self-hosted open-weight models (Nemotron Parse and admin deployments) behind llm-gateway"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "BLE", "ASYNC", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# Transformers and PyTorch types are partial and change between releases; treat them as Any at the boundary.
[[tool.mypy.overrides]]
module = ["transformers", "transformers.*", "torch", "torch.*", "timm.*", "pymupdf.*", "psutil.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.engines.transformers_engine"]
disallow_subclassing_any = false
