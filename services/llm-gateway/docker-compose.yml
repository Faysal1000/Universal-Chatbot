# Local stack for the LLM gateway: Postgres + migrations + backend. Its admin UI is the
# platform's admin console (services/admin-console, in the root docker-compose.yml).
#   cp .env.example .env   # then fill in the secrets (see the header of .env.example)
#   docker compose up --build
#   curl http://localhost:4000/health/ready       # gateway API (callers use http://localhost:4000/v1)
#
# Try it without real provider keys (adds a fake OpenAI/Anthropic-compatible provider
# reachable from the gateway at http://fake-provider:9100/openai/v1 and /anthropic/v1):
#   docker compose --profile demo up --build
#
# Secrets come from .env (LLM_GATEWAY_* variables); values under `environment:` only
# override container-specific concerns.
name: llm-gateway

x-hardening: &container-hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-gateway-database-url: &gateway-database-url
  LLM_GATEWAY_DATABASE_URL: postgresql+asyncpg://llm_gateway:${LLM_GATEWAY_DATABASE_PASSWORD:?set LLM_GATEWAY_DATABASE_PASSWORD in .env}@postgres:5432/llm_gateway

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: llm_gateway
      POSTGRES_PASSWORD: ${LLM_GATEWAY_DATABASE_PASSWORD:?set LLM_GATEWAY_DATABASE_PASSWORD in .env}
      POSTGRES_DB: llm_gateway
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Loopback only: for psql/admin tools on this machine, never the network.
      - "127.0.0.1:${LLM_GATEWAY_POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_gateway -d llm_gateway"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  llm-gateway-migrate:
    build:
      context: .
      target: runtime
    image: llm-gateway-backend:local
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      <<: *gateway-database-url
    depends_on:
      postgres:
        condition: service_healthy
    <<: *container-hardening
    restart: "no"

  llm-gateway-backend:
    build:
      context: .
      target: runtime
    image: llm-gateway-backend:local
    env_file: .env
    environment:
      <<: *gateway-database-url
      LLM_GATEWAY_HOST: 0.0.0.0
      LLM_GATEWAY_PORT: "4000"
    ports:
      - "${LLM_GATEWAY_BACKEND_HOST_PORT:-4000}:4000"
    depends_on:
      llm-gateway-migrate:
        condition: service_completed_successfully
    <<: *container-hardening
    # Must exceed LLM_GATEWAY_GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS so open streams can finish.
    stop_grace_period: 45s
    restart: unless-stopped

  fake-provider:
    profiles: ["demo"]
    build:
      context: .
      target: fake-provider
    image: llm-gateway-fake-provider:local
    <<: *container-hardening
    restart: unless-stopped

volumes:
  postgres-data:
