# The Space's only public port. Everything else listens on 127.0.0.1 inside the container.
#   /             chat (static files)
#   /v1/public/   rag's public chat API, used by the chat and by the embeddable widget
#   /admin/       admin console (its backend holds every service's admin key)
worker_processes 1;
pid /tmp/space/nginx.pid;
error_log stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;

  client_body_temp_path /tmp/space/nginx/body;
  proxy_temp_path /tmp/space/nginx/proxy;
  fastcgi_temp_path /tmp/space/nginx/fastcgi;
  uwsgi_temp_path /tmp/space/nginx/uwsgi;
  scgi_temp_path /tmp/space/nginx/scgi;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Connection "";

  server {
    listen 7860;
    root /srv/chat;

    location /v1/public/ {
      # Answers and ingestion events stream as server-sent events.
      proxy_buffering off;
      # Visitor image uploads: rag's 5 MiB limit plus multipart overhead.
      client_max_body_size 6m;
      proxy_read_timeout 300s;
      proxy_pass http://127.0.0.1:8080;
    }

    location = /admin {
      return 301 /admin/;
    }

    location /admin/ {
      # Uploads up to rag's 50 MiB limit plus multipart overhead.
      client_max_body_size 60m;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_pass http://127.0.0.1:3100/;
    }

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    location /assets/ {
      include /etc/nginx/space/chat-security-headers.inc;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location = /runtime-config.js {
      include /etc/nginx/space/chat-security-headers.inc;
      add_header Cache-Control "no-store" always;
      alias /tmp/space/runtime-config.js;
    }

    location / {
      include /etc/nginx/space/chat-security-headers.inc;
      add_header Cache-Control "no-cache" always;
      try_files $uri /index.html;
    }
  }
}
