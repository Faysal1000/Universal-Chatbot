# Every push to main: test every service, build the one-container image
# (deploy/huggingface-space), push it to GHCR, then replace the Space repository with a single
# commit whose Dockerfile pins that image by digest. The Space only pulls; it never builds.
#
# Needs the HF_DEPLOY_TOKEN secret (a Hugging Face write token) plus the Space secrets listed in
# deploy/huggingface-space/README.md, which are copied to the Space. Nothing is published until the
# HF_SPACE variable names the Space (owner/name).
name: huggingface-space

on:
  push:
    branches: [main]
    paths:
      - services/**
      - deploy/huggingface-space/**
      - .github/workflows/huggingface-space.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-space
  cancel-in-progress: false

jobs:
  embedding-server:
    uses: ./.github/workflows/embedding-server.yml
  local-llm:
    uses: ./.github/workflows/local-llm.yml
  llm-gateway:
    uses: ./.github/workflows/llm-gateway.yml
  rag:
    uses: ./.github/workflows/rag.yml
  admin-console:
    uses: ./.github/workflows/admin-console.yml
  chat:
    uses: ./.github/workflows/chat.yml

  image:
    name: Build and push the Space image
    needs: [embedding-server, local-llm, llm-gateway, rag, admin-console, chat]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.reference.outputs.reference }}
    steps:
      # Two PyTorch virtualenvs and seven service images do not fit the runner's free disk.
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/universal-chatbot-space" >> "$GITHUB_OUTPUT"
      - uses: docker/bake-action@v6
        with:
          source: .
          files: deploy/huggingface-space/docker-bake.hcl
          push: true
        env:
          SPACE_IMAGE: ${{ steps.name.outputs.image }}:${{ github.sha }}
          CACHE_BACKEND: gha
      - name: Image reference by digest
        id: reference
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "reference=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"

  space:
    name: Publish to the Hugging Face Space
    needs: image
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: huggingface-space
      url: https://huggingface.co/spaces/${{ vars.HF_SPACE }}
    env:
      SPACE: ${{ vars.HF_SPACE }}
      HF_DEPLOY_TOKEN: ${{ secrets.HF_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=0.34,<2"
      - name: Copy secrets and variables to the Space
        run: python deploy/huggingface-space/sync_space_settings.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          LLM_GATEWAY_ENCRYPTION_KEY: ${{ secrets.LLM_GATEWAY_ENCRYPTION_KEY }}
          RAG_CLIENT_HASH_SECRET: ${{ secrets.RAG_CLIENT_HASH_SECRET }}
          ADMIN_CONSOLE_ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_CONSOLE_ADMIN_PASSWORD_HASH }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ADMIN_CONSOLE_ADMIN_USERNAME: ${{ vars.ADMIN_CONSOLE_ADMIN_USERNAME }}
          CHAT_WIDGET_ALLOWED_ORIGINS: ${{ vars.CHAT_WIDGET_ALLOWED_ORIGINS }}
          CHAT_RUNTIME_BOT_NAME: ${{ vars.CHAT_RUNTIME_BOT_NAME }}
          CHAT_RUNTIME_BRAND_ACCENT: ${{ vars.CHAT_RUNTIME_BRAND_ACCENT }}
          CHAT_RUNTIME_BRAND_LOGO_URL: ${{ vars.CHAT_RUNTIME_BRAND_LOGO_URL }}
      - name: Replace the Space repository with one commit
        env:
          IMAGE_REFERENCE: ${{ needs.image.outputs.reference }}
        run: |
          space_repository=$(mktemp -d)
          cp deploy/huggingface-space/space-card.md "$space_repository/README.md"
          printf 'FROM %s\n' "$IMAGE_REFERENCE" > "$space_repository/Dockerfile"
          cd "$space_repository"
          git init --quiet --initial-branch main
          git add README.md Dockerfile
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit --quiet -m "Deploy ${GITHUB_SHA::7}"
          git push --force --quiet "https://user:${HF_DEPLOY_TOKEN}@huggingface.co/spaces/${SPACE}" main
