name: chat

on:
  push:
    branches: [main]
    paths:
      - services/frontend-chat-interface/**
      - .github/workflows/chat.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, format, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/frontend-chat-interface
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/frontend-chat-interface/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
