name: local-llm

on:
  push:
    branches: [main]
    paths:
      - services/local-llm/**
      - .github/workflows/local-llm.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/local-llm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/local-llm/requirements*.txt
      - name: Install CPU PyTorch, then the service's dependencies
        run: |
          pip install "torch>=2.9,<3" torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q
