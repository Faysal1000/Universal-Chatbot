; Every process of the Space. entrypoint.sh has already exported each service's settings and run
; the database migrations. All output goes to the container log, which the Space shows as Logs.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/space/supervisord.pid

[unix_http_server]
file=/tmp/space/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/space/supervisor.sock

[program:redis]
; BullMQ needs noeviction. Nothing is persisted: the queue only holds jobs of in-flight uploads.
command=redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no --maxmemory-policy noeviction
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:embedding-server]
command=/opt/embedding-server/bin/python -m app
directory=/srv/embedding-server
priority=20
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:local-llm]
command=/opt/local-llm/bin/python -m app
directory=/srv/local-llm
priority=20
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:llm-gateway]
command=/opt/llm-gateway/bin/python -m app
directory=/srv/llm-gateway
priority=20
autorestart=true
stopwaitsecs=45
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:rag-api]
command=node --enable-source-maps dist/main.api.js
directory=/srv/rag
environment=RAG_PORT="8080"
priority=30
autorestart=true
stopwaitsecs=45
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:rag-worker]
command=node --enable-source-maps dist/main.worker.js
directory=/srv/rag
environment=RAG_PORT="8081"
priority=30
autorestart=true
stopwaitsecs=45
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:document-parser]
command=/opt/document-parser/bin/python -m app
directory=/srv/document-parser
; Tesseract runs one thread per page job; elsewhere OpenMP keeps all cores.
environment=OMP_THREAD_LIMIT="1"
priority=30
autorestart=true
stopwaitsecs=90
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:admin-console]
command=node --enable-source-maps dist/server/main.js
directory=/srv/admin-console
priority=40
autorestart=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -c /etc/nginx/space/nginx.conf -g "daemon off;" -e stderr
priority=50
autorestart=true
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; A program that gave up restarting stops the container, so the Space restarts instead of running without it.
[eventlistener:exit-on-fatal]
command=sh -c 'printf "READY\n"; read -r header; kill -s TERM "$PPID"'
events=PROCESS_STATE_FATAL
